# Render blueprint for the VSN backend (optional — Vercel handles the frontend).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vsn-ai-music-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app
      - key: DAILY_LIMIT
        value: "10"
      - key: HF_API_TOKEN
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
